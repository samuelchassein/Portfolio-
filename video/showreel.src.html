<!doctype html>

</style>
</head>

/* ============================================================================

  12,66  Floral (cercle d'ambiance depuis le flacon, particules en anneau) ............ whoosh
  14,06  Boisé ............................................................................. whoosh
  15,47  Ambré ; 16,40 barre verte qui balaie ............................................ whoosh
  16,88  S5 Produit : carte de réservation en 3D, curseur, créneau, envoi ............. impact, clics
  20,86  « Demande envoyée ✓ » + toast ; 21,80 la pastille dorée grandit en aplat ivoire  carillon, whoosh
  22,50  S6 La gamme : 4 rendus Blender tombent sur le temps .......................... 4 chocs
  24,38  S7 Visite : arches photo qui montent, titre italique .......................... whoosh
  25,78  tout se replie en un point, cercle vert ......................................... riser
  26,25  S8 Signature : point doré, onde, wordmark, filet, URL tapée, tenue .......... impact, cloche
  30,00  fin
   ========================================================================== */

/* ---------- helpers ---------- */
function spring(t, w = 14, z = 0.82) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const track = (v0, keys) => t => { let v = v0, p = v0; for (const [tk, val, w, z] of keys) { v += (val - p) * spring(t - tk, w, z); p = val; } return v; };
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };

const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOut = x => (x = clamp(x), 1 - Math.pow(1 - x, 3));
const eIn = x => (x = clamp(x), x * x * x);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), Bc = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, Bc[i], clamp(k)))).join(",")})`; };

  { nom: "Boisé", notes: ["Cèdre", "Santal", "Vétiver"], evo: "Un sous-bois à l’heure où la lumière devient oblique.", amb: ["#E3DACA", "#B9A88C"], encre: "#1F3A2E", jus: "#8C6A3A" },

    const col = eIn(seg(u, 3 * B, 4 * B));
    tr(s7cam, `scale(${lerp(1, .02, col)})`); op(s7cam, 1 - seg(u, 3.7 * B, 4 * B));
    const cr = 1400 * eIn(seg(u, 3.2 * B, 4 * B));
    Object.assign(s7circle.style, { width: 2 * cr + "px", height: 2 * cr + "px", left: W / 2 - cr + "px", top: H / 2 - cr + "px" });
  }

  /* S8 */
  if (t >= T.s8) {
    vis(s8, true); stage.style.background = C.green;
    const u = t - T.s8;
    tr(s8cam, `scale(${lerp(1, 1.035, ease(seg(u, 0, 3.75)))})`);
    rings.forEach((r, i) => { const p = seg(u - i * .18, 0, 1.2), rr = 20 + eOut(p) * 520; Object.assign(r.style, { width: 2 * rr + "px", height: 2 * rr + "px", left: W / 2 - rr + "px", top: H / 2 - rr + "px" }); op(r, (1 - p) * (p > 0 ? .8 : 0)); });
    // le point doré devient le filet sous le wordmark
    const st = eOut(seg(u, B, 2.2 * B)), up = ease(seg(u, .2, B * 1.2));
    const dw = lerp(26, 460, st), dh = lerp(26, 2, st), dy = lerp(H / 2, WMY + WMH + 36, up);
    Object.assign(s8dot.style, { width: dw + "px", height: dh + "px", left: W / 2 - dw / 2 + "px", top: dy - dh / 2 + "px", borderRadius: lerp(13, 0, st) + "px" });
    tr(s8dot, `scale(${spring(u, 18, .5)})`);
    op(wmM, seg(u, 1.5 * B, 2.2 * B)); tr(wmM, `translateY(${(1 - spring(u - 1.5 * B, 12, .85)) * 30}px)`);
    tr(wmS, `translateY(${(1 - spring(u - 1.9 * B, 13, .8)) * 100}%)`);
    tr(s8tag.firstChild, `translateY(${(1 - spring(u - 2.6 * B, 13, .85)) * 110}%)`);
    const tx = typed(URL_TXT, u, 3.2 * B, B / 8);
    s8url.textContent = tx + (Math.floor(u / (B / 2)) % 2 ? "▍" : " ");
  }

  /* grain + vignette + HUD */
  gctx.clearRect(0, 0, W, H);
  const tile = tiles[Math.floor(t * 24) % 4];
  for (let y = 0; y < H; y += 256) for (let x = 0; x < W; x += 256) gctx.drawImage(tile, x, y);
  op(vig, dark ? 1 : .55);
  const hc = dark ? "rgba(246,237,221,.6)" : "rgba(28,26,23,.5)";
  hud.style.color = hc; HB.forEach(b => b.style.borderColor = hc);
  hTR.textContent = `SCÈNE 0${sceneIdx + 1} / 08`;
  hBL.textContent = SC[sceneIdx][1];
  const fr = Math.floor((t % 1) * 30), ss = Math.floor(t);
  hBR.innerHTML = `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#E5483B;margin-right:12px;opacity:${Math.floor(t * 2) % 2 ? .35 : 1}"></span>00:${String(ss).padStart(2, "0")}:${String(fr).padStart(2, "0")}`;
}
window.seek = seek;

/* ---------- bande-son (synthèse) ---------- */
window.buildAudio = async function (ctx) {
  const sr = ctx.sampleRate, out = ctx.createDynamicsCompressor();
  out.threshold.value = -14; out.ratio.value = 3; out.attack.value = .005; out.release.value = .2;
  const master = ctx.createGain(); master.gain.value = .8; out.connect(master); master.connect(ctx.destination);
  const music = ctx.createGain(); music.gain.value = .55; music.connect(out);
  const fxb = ctx.createGain(); fxb.gain.value = .8; fxb.connect(out);
  const R = rng(42), nb = ctx.createBuffer(1, sr * 2, sr), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;
  const noise = (t0, dur, type, f0, f1, g0, dest, q = 1) => {
    const s = ctx.createBufferSource(); s.buffer = nb; const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(g0, t0 + Math.min(.01, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t0, R()); s.stop(t0 + dur + .05);
  };
  const tone = (t0, dur, f0, f1, g0, type, dest, att = .005) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t0); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(g0, t0 + att); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + dur + .05);
  };
  const kick = (t0, g = 1) => { tone(t0, .42, 150, 42, .95 * g, "sine", music, .002); noise(t0, .03, "highpass", 3000, 2000, .15 * g, music); };
  const clap = t0 => { for (const d of [0, .012, .024]) noise(t0 + d, .16, "bandpass", 1600, 1200, .35, music, 1.2); };
  const hat = (t0, g = .12) => noise(t0, .05, "highpass", 8000, 9000, g, music);
  const impact = t0 => { tone(t0, 1.1, 70, 28, .9, "sine", fxb, .003); noise(t0, .7, "lowpass", 3000, 200, .5, fxb); };
  const whoosh = (t0, d = .45) => noise(t0, d, "bandpass", 400, 4000, .22, fxb, 2.5);
  const riser = (t0, d) => { const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true; const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 3; f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(7000, t0 + d); const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(.3, t0 + d); g.gain.linearRampToValueAtTime(0, t0 + d + .02); s.connect(f); f.connect(g); g.connect(fxb); s.start(t0); s.stop(t0 + d + .05); };
  const blip = (t0, f = 880, g = .18) => { tone(t0, .14, f, f, g, "sine", fxb); tone(t0, .1, f * 2, f * 2, g * .3, "triangle", fxb); };
  const bell = (t0, g = .3) => { for (const [m, a, d] of [[1, 1, 3.2], [2.01, .45, 2.2], [3.02, .25, 1.4], [4.1, .12, .9]]) tone(t0, d, 523.25 * m, 523.25 * m, g * a, "sine", fxb, .004); };
  const click = t0 => noise(t0, .03, "bandpass", 3500, 3000, .35, fxb, 4);

  // harmonie : Ré m — Si♭ — Fa — Do (une mesure chacun)
  const roots = [73.42, 58.27, 87.31, 65.41];
  const chords = [[146.8, 174.6, 220], [116.5, 146.8, 174.6], [174.6, 220, 261.6], [130.8, 164.8, 196]];
  for (let bar = 0; bar < 16; bar++) {
    const t0 = bar * BAR, c = chords[bar % 4];
    // nappe
    for (const f of c) { tone(t0, BAR + .3, f, f, .05, "triangle", music, .35); tone(t0, BAR + .3, f * 1.004, f * 1.004, .03, "sawtooth", music, .4); }
    // basse en croches à partir de la mesure 3
    if (bar >= 2 && bar < 14) for (let e = 0; e < 8; e++) if (e % 2 === 0 || e === 3 || e === 7) tone(t0 + e * B / 2, B / 2 * .9, roots[bar % 4], roots[bar % 4], .32, "sawtooth", (() => { const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 320; f.connect(music); return f; })(), .005);
  }
  // pulsation d'intro
  for (let b = 1; b < 8; b += 2) tone(b * B, .3, 60, 40, .35, "sine", music);
  // groove principal (mesures 3 à 14)
  for (let b = 8; b < 56; b++) {
    const t0 = b * B;
    kick(t0, b % 4 === 0 ? 1 : .85);
    if (b % 2 === 1) clap(t0);
    hat(t0 + B / 2); if (b >= 24) hat(t0 + B / 4, .05), hat(t0 + 3 * B / 4, .05);
  }
  kick(56 * B, 1.1);
  // événements
  riser(4 * B, 4 * B); [8, 16, 24, 36, 48].forEach(b => impact(b * B)); impact(56 * B);
  [6 * B, 14.6 * B, 23.4 * B, 27 * B - .2, 30 * B - .2, 33 * B - .2, 35 * B, 47.4 * B, 51.6 * B].forEach(t => whoosh(t));
  for (let i = 0; i < 5; i++) tone(9 * B + i * B / 4, .08, 1760, 1760, .07, "sine", fxb);
  blip(11 * B, 660); [16, 18, 20, 22].forEach((b, i) => blip(b * B, [880, 988, 1175, 1318][i]));
  [2 * B + .1, 4 * B + .6, 6 * B + .5].forEach(c => click(T.s5 + c));
  for (let i = 0; i < 6; i++) tone(T.s5 + 6 * B + .62 + i * .12, .06, 1200 + i * 120, 1200 + i * 120, .05, "sine", fxb);
  bell(T.s5 + 8 * B + .12, .22);
  [48, 48.75, 49.5, 50.25].forEach(b => { tone(b * B, .35, 110, 50, .7, "sine", fxb, .002); noise(b * B, .08, "lowpass", 2000, 400, .3, fxb); });
  riser(T.s7 + 2.6 * B, 1.4 * B);
  bell(T.s8, .35); bell(T.s8 + 2 * B, .12);
  for (let i = 0; i < URL_TXT.length; i++) tone(T.s8 + 3.2 * B + i * B / 8, .03, 2400, 2400, .03, "square", fxb);
  for (const f of [146.8, 220, 293.7]) tone(T.s8, 3.6, f, f, .06, "triangle", music, .8);
};

/* ---------- aperçu interactif (sans ?render) ---------- */
if (!RENDER) {
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 50) / H); stage.style.transform = `scale(${k})`; };
  addEventListener("resize", fit); fit();
  const bar = el(document.body, "", "", {}); bar.id = "controls";
  const pb = document.createElement("button"); pb.textContent = "▶ Lecture"; bar.appendChild(pb);
  const rg = document.createElement("input"); rg.type = "range"; rg.min = 0; rg.max = DUR; rg.step = .01; rg.value = 0; bar.appendChild(rg);
  const lab = el(bar, "", "0.00 s");
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * DUR), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % DUR); startAt = ac.currentTime; playing = true; pb.textContent = "❚❚ Pause"; }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; pb.textContent = "▶ Lecture"; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % DUR : offset;
  pb.onclick = () => playing ? pause() : play();
  rg.oninput = () => { const p = playing; pause(); offset = +rg.value; if (p) play(); };
  (function loop() { const t = now(); seek(t); rg.value = t; lab.textContent = t.toFixed(2) + " s"; requestAnimationFrame(loop); })();
} else seek(0);
</script>
